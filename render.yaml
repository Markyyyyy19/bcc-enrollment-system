services:
  - type: web
    name: bcc-enrollment
    env: php
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: errorlog
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromService:
          type: postgres
          name: bcc-enrollment-db
          property: host
      - key: DB_PORT
        fromService:
          type: postgres
          name: bcc-enrollment-db
          property: port
      - key: DB_DATABASE
        fromService:
          type: postgres
          name: bcc-enrollment-db
          property: database
      - key: DB_USERNAME
        fromService:
          type: postgres
          name: bcc-enrollment-db
          property: user
      - key: DB_PASSWORD
        fromService:
          type: postgres
          name: bcc-enrollment-db
          property: password

databases:
  - name: bcc-enrollment-db
    databaseName: bcc_enrollment
    user: bcc_user
    plan: free
