services:
  - type: web
    name: bcc-enrollment
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: errorlog
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: bcc-enrollment-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: bcc-enrollment-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: bcc-enrollment-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: bcc-enrollment-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bcc-enrollment-db
          property: password

databases:
  - name: bcc-enrollment-db
    databaseName: bcc_enrollment
    user: bcc_user
    plan: free
